stages:
  - verify
  - test
  - release

include:
  - project: 'sds-dev/releases'
    ref: main
    file: 'releases.yml'

default:
  image: "${ARTIFACTORY_SERVER}/sds/sdd-common-ci:2026.10.0@sha256:4dbef76cae6000a9fed4636a748d6411a7c0959e2f9e5562090eaec572f74c26"

python-lint:
  stage: verify
  tags:
    - sds-test
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  before_script:
    - pip install pre-commit mypy .[dev]
  script:
    - pre-commit run --all-files -c .pre-commit-config.yaml --show-diff-on-failure --color never
    - tox -re bandit

python-test:
  stage: test
  tags:
    - sds-test
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  before_script:
    - pip install .[test]
  script:
    - tox -e pytest
    - coverage run -m pytest tests/
    - coverage report --precision=1
  coverage: '/TOTAL.*\s+(\d+\%)/'

release:
  extends: .automated-release
  release:
    description: $(cat release_changes.md)

# This is a manual dry-run for users to run in the merge request
update-versions-dryrun:
  extends: .update-versions-dryrun
  variables:
    UPDATE_VERSION_FILES_LIST: "sd_lock_utility/__init__.py"
    VERSION_UPDATE_INDICATOR: "__version__"

# This job updates the versions
update-versions:
  extends: .update-versions
  variables:
    UPDATE_VERSION_FILES_LIST: "sd_lock_utility/__init__.py"
    VERSION_UPDATE_INDICATOR: "__version__"
