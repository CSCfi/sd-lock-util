[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sd-lock-utility"
dynamic = ["version"]
description = "CLI utility tool for SD Connect encrypted object storage."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "CSC Developers" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Topic :: Communications :: File Sharing",
]
dependencies = [
    "aiohttp==3.9.5",
    "click==8.5.0",
    "crypt4gh==1.8.6",
    "certifi==2026.10.23",
    "aiofiles==23.2.1",
    "aioboto3==13.4.0",
    "types-aiobotocore-s3==2.26.0",
    "asyncstdlib==3.14.0",
]

[project.optional-dependencies]
test = [
    "black==24.4.2",
    "coverage==7.17.0",
    "flake8-docstrings==1.7.0",
    "flake8==7.5.0",
    "mypy==1.20.2",
    "pytest-cov==5.0.0",
    "pytest-xdist==3.8.0",
    "pytest==8.2.0",
    "tox==4.67.5",
]

dev = [
    "pre-commit==3.8.0",
    "pyspelling==2.13",
    "ruff==0.17.3",
    "types-aiofiles==23.2.0.20240623",
]

build = [
    "pyinstaller==6.22.3",
]

[project.scripts]
sd-lock = "sd_lock_utility.cli:lock"
sd-unlock = "sd_lock_utility.cli:unlock"
sd-pubkey = "sd_lock_utility.cli:pubkey"
sd-check-id = "sd_lock_utility.cli:check_id"
sd-fix-header-permissions = "sd_lock_utility.cli:fix_header_permissions"
sd-fix-missing-headers = "sd_lock_utility.cli:fix_missing_headers"
sd-migrate-headers = "sd_lock_utility.cli:migrate_headers"
sd-migrate-sharing = "sd_lock_utility.cli:migrate_sharing"
sd-push-headers = "sd_lock_utility.cli:push_headers"
sd-fix-shared-bucket-segment-access = "sd_lock_utility.cli:fix_shared_bucket_segment_access"
sd-lock-util = "sd_lock_utility.cli:wrap"

[project.urls]
Source = "https://github.com/CSCfi/sd-lock-util"
Documentation = "https://github.com/CSCfi/sd-lock-util"

[tool.hatch.version]
path = "sd_lock_utility/__init__.py"

[tool.black]
line-length = 90
target-version = ['py312']

[tool.isort]
atomic = true
profile = "black"
line_length = 90
py_version=312

[tool.ruff]
line-length = 90
target-version = "py312"

# https://beta.ruff.rs/docs/rules/
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    # "ANN",   # flake8-annotations
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "D",   # pydocstyle
#    "UP",  # pyupgrade
    "S",   # Bandit
]
ignore = [
    "ANN101",  # Missing type annotation for `self` in method
    "E501",    # line too long, handled by black
    "B904",    # do not perform function calls in argument defaults
    "PLR2004", # magic value used in comparison
    "S113",    # Probable use of requests call without timeout
    "D203",    # one-blank-line-before-class
    "D213",    # multi-line-summary-second-line
]

[tool.ruff.lint.mccabe]
max-complexity = 30
